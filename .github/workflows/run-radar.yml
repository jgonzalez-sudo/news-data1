name: Run news radar

on:
  schedule:
    # Twice a day at 05:00 and 13:00 UTC. Adjust as needed.
    - cron: '0 5,13 * * *'
  workflow_dispatch:
    inputs:
      groups:
        description: 'Optional: comma-separated group names to run (leave blank for all active groups)'
        required: false
        default: ''

permissions:
  contents: write  # lets the job commit radar.json back to this repo

jobs:
  radar:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install feedparser requests

      - name: Run radar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          RADAR_GROUPS: ${{ github.event.inputs.groups }}
        run: python radar.py
