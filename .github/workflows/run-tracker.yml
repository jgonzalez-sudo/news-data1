name: Run Africa tracker

on:
  schedule:
    # Daily at 06:00 UTC. Adjust the cron expression to change the time.
    - cron: '0 6 * * *'
  workflow_dispatch: {}  # lets you run it by hand from the Actions tab

permissions:
  contents: write  # lets the script commit the updated JSON files back to this repo

jobs:
  run-tracker:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install feedparser deep-translator requests

      - name: Run Africa tracker
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # Your own webhook (the DM you've been testing with)
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          # The Africa team channel. Leave this secret unset until you're happy with the product.
          SLACK_WEBHOOK_URL_AFRICA_TEAM: ${{ secrets.SLACK_WEBHOOK_URL_AFRICA_TEAM }}
        run: python news_tracker_optimized.py africa
