<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<style>
  :root {
    --cream: #f4ecdd;
    --paper: #faf5ea;
    --ink: #1c1a17;
    --ink-soft: #4a453c;
    --rule: #d8cbb0;
    --orange: #c9622a;
    --orange-deep: #a94e1f;
    --dark: #201d1a;
    --dark-2: #2a2621;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background: var(--dark);
    color: var(--cream);
    font-family: 'Georgia', 'Iowan Old Style', 'Times New Roman', serif;
  }
  .masthead {
    background: var(--dark);
    border-bottom: 3px solid var(--orange);
    padding: 28px 32px 18px;
    text-align: center;
  }
  .masthead .kicker {
    font-family: 'Helvetica Neue', Arial, sans-serif;
    letter-spacing: 0.25em;
    text-transform: uppercase;
    font-size: 11px;
    color: var(--orange);
    margin-bottom: 8px;
  }
  .masthead h1 {
    margin: 0;
    font-size: 42px;
    font-weight: 700;
    letter-spacing: 0.01em;
  }
  .masthead .dateline {
    font-family: 'Helvetica Neue', Arial, sans-serif;
    font-size: 12px;
    color: #a8a196;
    margin-top: 10px;
    letter-spacing: 0.05em;
  }
  .controls {
    position: sticky;
    top: 0;
    z-index: 10;
    background: var(--dark-2);
    border-bottom: 1px solid #3a352e;
    padding: 14px 24px;
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    align-items: center;
    font-family: 'Helvetica Neue', Arial, sans-serif;
  }
  .tab-row {
    display: flex;
    gap: 4px;
    background: var(--dark);
    padding: 0 24px;
    border-bottom: 1px solid #3a352e;
    font-family: 'Helvetica Neue', Arial, sans-serif;
  }
  .tab-btn {
    background: none;
    border: none;
    color: #a8a196;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.03em;
    padding: 14px 16px 12px;
    cursor: pointer;
    border-bottom: 3px solid transparent;
    transition: color 0.15s ease, border-color 0.15s ease;
  }
  .tab-btn:hover { color: var(--cream); }
  .tab-btn.active {
    color: var(--cream);
    border-bottom-color: var(--orange);
  }
  .schedule-wrap {
    padding: 24px;
  }
  .schedule-note {
    font-family: 'Helvetica Neue', Arial, sans-serif;
    font-size: 12px;
    color: #a8a196;
    margin: 0 0 18px;
    letter-spacing: 0.03em;
  }
  .schedule-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
    gap: 14px;
  }
  .day-card {
    background: var(--paper);
    border-radius: 4px;
    border-top: 3px solid var(--orange);
    overflow: hidden;
    box-shadow: 0 2px 6px rgba(0,0,0,0.25);
  }
  .day-card h3 {
    font-family: 'Helvetica Neue', Arial, sans-serif;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    font-size: 11.5px;
    color: var(--orange-deep);
    background: rgba(201,98,42,0.10);
    margin: 0;
    padding: 10px 14px;
  }
  .day-card ul {
    list-style: none;
    margin: 0;
    padding: 6px 0;
  }
  .day-card li {
    display: flex;
    justify-content: space-between;
    gap: 8px;
    padding: 7px 14px;
    font-family: 'Helvetica Neue', Arial, sans-serif;
    font-size: 12.5px;
    color: var(--ink);
    border-bottom: 1px solid var(--rule);
  }
  .day-card li:last-child { border-bottom: none; }
  .day-card li .nl-name { font-weight: 600; }
  .nl-link {
    cursor: pointer;
    color: var(--orange-deep);
    text-decoration: none;
    border-bottom: 1px dotted var(--orange-deep);
    transition: color 0.15s ease, border-color 0.15s ease;
  }
  .nl-link:hover {
    color: var(--orange);
    border-bottom-color: var(--orange);
  }
  .day-card li .nl-time {
    color: var(--ink-soft);
    white-space: nowrap;
    font-size: 11.5px;
  }
  .day-card .empty {
    padding: 14px;
    font-family: 'Helvetica Neue', Arial, sans-serif;
    font-size: 12px;
    color: #8a8072;
    font-style: italic;
  }
  #search {
    flex: 1 1 220px;
    background: var(--paper);
    color: var(--ink);
    border: none;
    border-radius: 3px;
    padding: 9px 12px;
    font-size: 14px;
    font-family: 'Helvetica Neue', Arial, sans-serif;
  }
  #search::placeholder { color: #8a8072; }
  .chip {
    background: transparent;
    border: 1px solid #55503;
    border: 1px solid #55503a;
    color: #cfc7b7;
    font-size: 12px;
    padding: 6px 12px;
    border-radius: 20px;
    cursor: pointer;
    font-family: 'Helvetica Neue', Arial, sans-serif;
    transition: all 0.15s ease;
    white-space: nowrap;
  }
  .chip:hover { border-color: var(--orange); color: var(--cream); }
  .chip.active {
    background: var(--orange);
    border-color: var(--orange);
    color: #1c1a17;
    font-weight: 600;
  }
  .chip-row {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    overflow-x: auto;
    max-width: 100%;
  }
  #count {
    font-size: 12px;
    color: #8a8072;
    margin-left: auto;
    white-space: nowrap;
  }
  #refreshBtn {
    background: transparent;
    border: 1px solid #55503a;
    color: #cfc7b7;
    font-size: 12px;
    padding: 6px 12px;
    border-radius: 20px;
    cursor: pointer;
    font-family: 'Helvetica Neue', Arial, sans-serif;
    transition: all 0.15s ease;
    white-space: nowrap;
  }
  #refreshBtn:hover { border-color: var(--orange); color: var(--cream); }
  #refreshBtn:disabled { opacity: 0.5; cursor: default; }
  .load-state {
    padding: 60px 24px;
    text-align: center;
    color: #a8a196;
    font-family: 'Helvetica Neue', Arial, sans-serif;
  }
  .load-state.error { color: #d98a6a; }
  .load-state a { color: var(--orange); text-decoration: underline; }
  .section-label {
    font-family: 'Helvetica Neue', Arial, sans-serif;
    text-transform: uppercase;
    letter-spacing: 0.2em;
    font-size: 12px;
    color: var(--orange);
    padding: 28px 28px 8px;
    border-top: 1px solid #3a352e;
    margin-top: 10px;
  }
  .section-label:first-of-type { border-top: none; }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
    gap: 18px;
    padding: 8px 24px 40px;
  }
  .card {
    background: var(--paper);
    color: var(--ink);
    border-radius: 4px;
    overflow: hidden;
    cursor: pointer;
    box-shadow: 0 2px 6px rgba(0,0,0,0.25);
    transition: transform 0.15s ease, box-shadow 0.15s ease;
    display: flex;
    flex-direction: column;
  }
  .card:hover {
    transform: translateY(-3px);
    box-shadow: 0 8px 18px rgba(0,0,0,0.35);
  }
  .photo-wrap {
    width: 100%;
    aspect-ratio: 1 / 1;
    background: #d8cbb0;
    overflow: hidden;
    position: relative;
    border-bottom: 3px solid var(--orange);
  }
  .photo-wrap img {
    width: 100%; height: 100%;
    object-fit: cover;
    display: block;
  }
  .initials {
    width: 100%; height: 100%;
    display: flex; align-items: center; justify-content: center;
    font-size: 42px;
    font-weight: 700;
    color: var(--orange-deep);
    background: #e6dcc3;
  }
  .card-body { padding: 14px 14px 16px; flex: 1; display: flex; flex-direction: column; }
  .card-name {
    font-size: 17px;
    font-weight: 700;
    line-height: 1.2;
    margin: 0 0 2px;
  }
  .card-title {
    font-family: 'Helvetica Neue', Arial, sans-serif;
    font-size: 12.5px;
    color: var(--ink-soft);
    margin: 0 0 8px;
    line-height: 1.3;
  }
  .badge-row {
    display: flex;
    flex-wrap: wrap;
    gap: 5px;
    margin-top: auto;
  }
  .card-team {
    font-family: 'Helvetica Neue', Arial, sans-serif;
    display: inline-block;
    font-size: 10.5px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--orange-deep);
    background: rgba(201,98,42,0.12);
    padding: 3px 8px;
    border-radius: 3px;
  }
  .card-loc {
    font-family: 'Helvetica Neue', Arial, sans-serif;
    display: inline-block;
    font-size: 10.5px;
    letter-spacing: 0.03em;
    color: var(--ink-soft);
    background: rgba(28,26,23,0.06);
    padding: 3px 8px;
    border-radius: 3px;
  }
  .empty-state {
    padding: 60px 24px;
    text-align: center;
    color: #8a8072;
    font-family: 'Helvetica Neue', Arial, sans-serif;
  }

  /* Modal */
  .modal-overlay {
    position: fixed; inset: 0;
    background: rgba(15,13,11,0.72);
    display: none;
    align-items: center; justify-content: center;
    z-index: 100;
    padding: 24px;
  }
  .modal-overlay.open { display: flex; }
  .modal {
    background: var(--paper);
    color: var(--ink);
    max-width: 480px;
    width: 100%;
    border-radius: 6px;
    overflow: hidden;
    box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    max-height: 88vh;
    overflow-y: auto;
  }
  .modal-top {
    display: flex;
    gap: 16px;
    padding: 22px 22px 14px;
    border-bottom: 2px solid var(--orange);
  }
  .modal-photo {
    width: 92px; height: 92px;
    border-radius: 4px;
    object-fit: cover;
    flex-shrink: 0;
    background: #d8cbb0;
  }
  .modal-initials {
    width: 92px; height: 92px;
    border-radius: 4px;
    flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 30px; font-weight: 700;
    color: var(--orange-deep);
    background: #e6dcc3;
  }
  .modal-name { font-size: 22px; font-weight: 700; margin: 0 0 4px; }
  .modal-title { font-family: 'Helvetica Neue', Arial, sans-serif; font-size: 13px; color: var(--ink-soft); }
  .modal-body { padding: 16px 22px 24px; font-family: 'Helvetica Neue', Arial, sans-serif; font-size: 13.5px; line-height: 1.55; }
  .modal-row { margin-bottom: 12px; }
  .modal-row .label {
    text-transform: uppercase;
    letter-spacing: 0.1em;
    font-size: 10.5px;
    color: var(--orange-deep);
    font-weight: 700;
    display: block;
    margin-bottom: 3px;
  }
  .close-btn {
    position: absolute;
    top: 14px; right: 18px;
    background: none; border: none;
    font-size: 22px; color: var(--ink-soft);
    cursor: pointer;
  }
  .modal { position: relative; }
</style>
</head>
<body>

<div class="masthead">
  <div class="kicker">Internal Directory</div>
  <h1>Semafor Who’s Who</h1>
  <div class="dateline">Editorial staff, and the departments editorial works closely with</div>
</div>

<div class="tab-row">
  <button class="tab-btn active" id="tabDirectory">Directory</button>
  <button class="tab-btn" id="tabSchedule">Weekly NL Schedule</button>
</div>

<div id="directoryView">
<div class="controls">
  <input type="text" id="search" placeholder="Search by name, title, or team…">
  <div class="chip-row" id="chipRow"></div>
  <button id="refreshBtn" title="Re-fetch the latest data from the sheet">⟳ Refresh</button>
  <div id="count"></div>
</div>

<div id="app"><div class="load-state" id="initialLoad">Loading directory…</div></div>
</div>

<div id="scheduleView" style="display:none;"></div>

<div class="modal-overlay" id="modalOverlay">
  <div class="modal" id="modalContent"></div>
</div>


<script>
const SHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRrtWiQmcJfaEE0W1NAyauZNLiDBttCP2Jk9jJGLJP0_K_YNcCAM-3zqUZWvZkzqFXSKHND3e_fP9pW/pub?gid=1852591954&single=true&output=csv";

let people = [];
let teams = [];
let dataLoaded = false;

let activeTeam = null;
let query = "";

// ---- Weekly newsletter schedule (all times Eastern) ----
const SCHEDULE_RAW = [
  { name: "DC AM",       time: "5:30am", days: [1,2,3,4,5] },
  { name: "Flagship AM", time: "6:00am", days: [1,2,3,4,5] },
  { name: "CEO",         time: "5:00am", days: [5] },
  { name: "China",       time: "7:00am", days: [2] },
  { name: "Africa",      time: "8:00am", days: [1,3,5] },
  { name: "Energy",      time: "8:00am", days: [2,4] },
  { name: "Gulf",        time: "8:00am", days: [1,2,3,4,5] },
  { name: "Americana",   time: "12:00pm", days: [3] },
  { name: "Business",    time: "2:00pm", days: [2,4] },
  { name: "Tech",        time: "2:00pm", days: [3,5] },
  { name: "DC PM",       time: "5:00pm", days: [1,2,3,4,5] },
  { name: "Flagship PM", time: "5:00pm", days: [0,1,2,3,4] },
  { name: "Media",       time: "6:00pm", days: [0] },
];

const DAY_NAMES = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];

// Map newsletter names (as shown in the schedule) to the matching team chip
// in the directory. A few newsletters (e.g. Americana) don't have a clean
// one-to-one team yet, so they're left unmapped and render as plain text.
const NL_TO_TEAM = {
  "DC AM": "DC",
  "Flagship AM": "Flagship",
  "CEO": "Business",
  "China": "China",
  "Africa": "Africa",
  "Energy": "Energy",
  "Gulf": "Gulf",
  "Business": "Business",
  "Tech": "Tech",
  "DC PM": "DC",
  "Flagship PM": "Flagship",
  "Media": "Media",
  "Americana": "DC",
};

function timeToMinutes(t) {
  const m = t.match(/(\d+):(\d+)(am|pm)/i);
  let h = parseInt(m[1], 10);
  const min = parseInt(m[2], 10);
  const ap = m[3].toLowerCase();
  if (ap === "pm" && h !== 12) h += 12;
  if (ap === "am" && h === 12) h = 0;
  return h * 60 + min;
}

function renderSchedule() {
  const view = document.getElementById('scheduleView');
  let html = `<div class="schedule-wrap">
    <p class="schedule-note">All times Eastern (ET) &mdash; standard time, no daylight-saving adjustment. Click a newsletter name to see who's on that team.</p>
    <div class="schedule-grid">`;

  for (let d = 0; d < 7; d++) {
    const items = SCHEDULE_RAW
      .filter(nl => nl.days.includes(d))
      .sort((a,b) => timeToMinutes(a.time) - timeToMinutes(b.time));

    html += `<div class="day-card"><h3>${DAY_NAMES[d]}</h3>`;
    if (items.length === 0) {
      html += `<div class="empty">No scheduled sends</div>`;
    } else {
      html += `<ul>` + items.map(nl => {
        const team = NL_TO_TEAM[nl.name];
        const nameHTML = team
          ? `<span class="nl-name nl-link" onclick="goToTeam('${team}')">${nl.name}</span>`
          : `<span class="nl-name">${nl.name}</span>`;
        return `<li>${nameHTML}<span class="nl-time">${nl.time} ET</span></li>`;
      }).join("") + `</ul>`;
    }
    html += `</div>`;
  }

  html += `</div></div>`;
  view.innerHTML = html;
}

function showDirectory() {
  document.getElementById('tabDirectory').classList.add('active');
  document.getElementById('tabSchedule').classList.remove('active');
  document.getElementById('directoryView').style.display = '';
  document.getElementById('scheduleView').style.display = 'none';
}
function showSchedule() {
  document.getElementById('tabSchedule').classList.add('active');
  document.getElementById('tabDirectory').classList.remove('active');
  document.getElementById('directoryView').style.display = 'none';
  document.getElementById('scheduleView').style.display = '';
}
function goToTeam(team) {
  activeTeam = team;
  query = "";
  const searchBox = document.getElementById('search');
  if (searchBox) searchBox.value = "";
  showDirectory();
  if (dataLoaded) render();
  window.scrollTo({ top: 0, behavior: "smooth" });
}

document.getElementById('tabDirectory').addEventListener('click', showDirectory);
document.getElementById('tabSchedule').addEventListener('click', showSchedule);
renderSchedule();

function initials(name) {
  return name.split(" ").filter(Boolean).slice(0,2).map(w => w[0]).join("").toUpperCase();
}

function matches(p) {
  const hay = (p.name + " " + p.title + " " + p.teams.join(" ") + " " + p.go_to_for + " " + (p.location||"")).toLowerCase();
  const qOk = query === "" || hay.includes(query.toLowerCase());
  const tOk = !activeTeam || p.teams.includes(activeTeam);
  return qOk && tOk;
}

function renderChips() {
  const row = document.getElementById('chipRow');
  row.innerHTML = "";
  const allChip = document.createElement('button');
  allChip.className = 'chip' + (activeTeam === null ? ' active' : '');
  allChip.textContent = 'All teams';
  allChip.onclick = () => { activeTeam = null; render(); };
  row.appendChild(allChip);
  teams.forEach(t => {
    const chip = document.createElement('button');
    chip.className = 'chip' + (activeTeam === t ? ' active' : '');
    chip.textContent = t;
    chip.onclick = () => { activeTeam = (activeTeam === t ? null : t); render(); };
    row.appendChild(chip);
  });
}

function cardHTML(p, idx) {
  const photoBlock = p.photo
    ? `<img src="${p.photo}" alt="${p.name}" onerror="this.replaceWith(Object.assign(document.createElement('div'),{className:'initials',textContent:'${initials(p.name)}'}))">`
    : `<div class="initials">${initials(p.name)}</div>`;
  const teamBadges = (p.teams || []).map(t => `<span class="card-team">${t}</span>`).join("");
  const locBadge = p.location ? `<span class="card-loc">${p.location}</span>` : "";
  return `
    <div class="card" data-idx="${idx}">
      <div class="photo-wrap">${photoBlock}</div>
      <div class="card-body">
        <p class="card-name">${p.name}</p>
        <p class="card-title">${p.title || ''}</p>
        <div class="badge-row">${teamBadges}${locBadge}</div>
      </div>
    </div>`;
}

function render() {
  renderChips();
  const app = document.getElementById('app');
  const filtered = people.filter(matches);
  document.getElementById('count').textContent = `${filtered.length} of ${people.length} people`;

  if (filtered.length === 0) {
    app.innerHTML = `<div class="empty-state">No one matches that search.</div>`;
    return;
  }

  const sections = {};
  filtered.forEach((p) => {
    const sec = p.section || 'Editorial';
    if (!sections[sec]) sections[sec] = [];
    sections[sec].push(p);
  });

  let html = "";
  Object.keys(sections).forEach(sec => {
    html += `<div class="section-label">${sec}</div><div class="grid">`;
    sections[sec].forEach(p => {
      const globalIdx = people.indexOf(p);
      html += cardHTML(p, globalIdx);
    });
    html += `</div>`;
  });
  app.innerHTML = html;

  document.querySelectorAll('.card').forEach(card => {
    card.addEventListener('click', () => openModal(parseInt(card.dataset.idx)));
  });
}

function openModal(idx) {
  const p = people[idx];
  const photoBlock = p.photo
    ? `<img class="modal-photo" src="${p.photo}" alt="${p.name}" onerror="this.replaceWith(Object.assign(document.createElement('div'),{className:'modal-initials',textContent:'${initials(p.name)}'}))">`
    : `<div class="modal-initials">${initials(p.name)}</div>`;

  let rows = "";
  if (p.teams && p.teams.length) rows += `<div class="modal-row"><span class="label">Team</span>${p.teams.join(", ")}</div>`;
  if (p.location) rows += `<div class="modal-row"><span class="label">Location</span>${p.location}</div>`;
  if (p.go_to_for) rows += `<div class="modal-row"><span class="label">Go to for</span>${p.go_to_for}</div>`;
  if (p.bio) rows += `<div class="modal-row"><span class="label">Bio</span>${p.bio}</div>`;
  if (!rows) rows = `<div class="modal-row" style="color:#8a8072;">No further details on file yet.</div>`;

  document.getElementById('modalContent').innerHTML = `
    <button class="close-btn" id="closeBtn">&times;</button>
    <div class="modal-top">
      ${photoBlock}
      <div>
        <p class="modal-name">${p.name}</p>
        <p class="modal-title">${p.title || ''}</p>
      </div>
    </div>
    <div class="modal-body">${rows}</div>
  `;
  document.getElementById('modalOverlay').classList.add('open');
  document.getElementById('closeBtn').onclick = closeModal;
}

function closeModal() {
  document.getElementById('modalOverlay').classList.remove('open');
}

document.getElementById('modalOverlay').addEventListener('click', (e) => {
  if (e.target.id === 'modalOverlay') closeModal();
});
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') closeModal();
});

document.getElementById('search').addEventListener('input', (e) => {
  query = e.target.value;
  if (dataLoaded) render();
});

document.getElementById('refreshBtn').addEventListener('click', () => loadData(true));

function parseRow(row) {
  const teamsList = (row.teams || "")
    .split(",")
    .map(s => s.trim())
    .filter(Boolean);
  return {
    name: (row.name || "").trim(),
    title: (row.title || "").trim(),
    teams: teamsList,
    location: (row.location || "").trim(),
    go_to_for: (row.go_to_for || "").trim(),
    bio: (row.bio || "").trim(),
    section: (row.section || "Editorial").trim(),
    photo: (row.photo_url || "").trim(),
  };
}

function loadData(isManualRefresh) {
  const app = document.getElementById('app');
  const refreshBtn = document.getElementById('refreshBtn');
  if (isManualRefresh) refreshBtn.disabled = true;

  if (SHEET_CSV_URL.indexOf("PASTE_YOUR") === 0) {
    app.innerHTML = `<div class="load-state error">
      This page isn't pointed at a published sheet yet.<br>
      Publish your Google Sheet (File &rarr; Share &rarr; Publish to web &rarr; CSV) and drop that URL into the SHEET_CSV_URL constant.
    </div>`;
    return;
  }

  // cache-bust so edits show up immediately rather than a cached copy
  const bustUrl = SHEET_CSV_URL + (SHEET_CSV_URL.includes("?") ? "&" : "?") + "_ts=" + Date.now();

  Papa.parse(bustUrl, {
    download: true,
    header: true,
    skipEmptyLines: true,
    complete: (results) => {
      if (!results.data || !results.data.length) {
        app.innerHTML = `<div class="load-state error">
          The sheet loaded but came back empty. Check the published sheet still has the header row and data.
        </div>`;
        if (isManualRefresh) refreshBtn.disabled = false;
        return;
      }
      people = results.data.map(parseRow).filter(p => p.name);

      const teamSet = new Set();
      people.forEach(p => p.teams.forEach(t => teamSet.add(t)));
      teams = Array.from(teamSet).sort((a,b) => a.toLowerCase().localeCompare(b.toLowerCase()));

      dataLoaded = true;
      render();
      if (isManualRefresh) refreshBtn.disabled = false;
    },
    error: (err) => {
      app.innerHTML = `<div class="load-state error">
        Couldn't load the sheet (${err.message || "unknown error"}).<br>
        Double-check it's still published to the web as CSV, and that the URL is correct.
      </div>`;
      if (isManualRefresh) refreshBtn.disabled = false;
    }
  });
}

loadData(false);

</script>

</body>
</html>
